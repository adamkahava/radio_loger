<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Radio Archive</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>
<body>
<main class="login panel">
<h1>RADIO ARCHIVE</h1>
<p class="muted">Broadcast Recording System</p>
{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" maxlength="128" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
<button class="primary">SIGN IN</button>
</form>
</main>
</body>
</html>
